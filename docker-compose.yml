services:
    pgadmin:
        image: dpage/pgadmin4:9
        container_name: pgadmin
        restart: unless-stopped
        ports:
            - 5050:80
        environment:
            PGADMIN_DEFAULT_EMAIL: demo@example.com
            PGADMIN_DEFAULT_PASSWORD: secret
            # Don't require the user to login
            PGADMIN_CONFIG_SERVER_MODE: "False"
            # Don't require a "master" password after logging in
            PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
        depends_on:
            postgres:
                condition: service_healthy
    postgres:
        image: postgres:18-alpine
        container_name: postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: keycloak
            POSTGRES_USER: keycloak
            POSTGRES_PASSWORD: keycloak
        ports:
            - "5432:5432"
        volumes:
            - ./postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U keycloak"]
            interval: 5s
            timeout: 5s
            retries: 5
    keycloak:
        image: keycloak/keycloak:26.7
        container_name: keycloak
        restart: unless-stopped
        command:
            - start
            - --import-realm
        environment:
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
            KC_DB_USERNAME: keycloak
            KC_DB_PASSWORD: keycloak
            KC_HOSTNAME: localhost
            KC_BOOTSTRAP_ADMIN_USERNAME: admin
            KC_BOOTSTRAP_ADMIN_PASSWORD: admin
            KC_HTTP_ENABLED: "true"
            KC_HTTP_PORT: "8080"
            KC_PROXY_HEADERS: "xforwarded"
        ports:
            - "8080:8080"
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - ./realms:/opt/keycloak/data/import
    redis:
        image: redis:7.4-alpine
        container_name: redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        command: redis-server --save 20 1 --loglevel warning --requirepass yourpassword
        volumes:
            - ./cache:/data
        depends_on:
            postgres:
                condition: service_healthy
volumes:
    postgres_data:
    cache:
